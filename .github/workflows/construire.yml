name: Construire et signer les extensions (prototype)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patch_extensions.py"
      - "tools/package_xpi.py"
      - ".github/workflows/construire.yml"

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer notre dépôt
        uses: actions/checkout@v4

      - name: Récupérer Read Aloud à une révision connue
        shell: bash
        run: |
          git clone --depth 1 --branch firefox https://github.com/Read-Aloud/read-aloud.git sources/read-aloud
          git -C sources/read-aloud fetch --depth 1 origin 8053a39541dc77e4ff7719348c406bad9792175a
          git -C sources/read-aloud checkout --detach 8053a39541dc77e4ff7719348c406bad9792175a

      - name: Récupérer TWP à une révision connue
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/FilipePS/Traduzir-paginas-web.git sources/twp
          git -C sources/twp fetch --depth 1 origin 50a92116542ab93524594cc210f4bf4e5d86a925
          git -C sources/twp checkout --detach 50a92116542ab93524594cc210f4bf4e5d86a925

      - name: Appliquer les modifications expérimentales
        run: python3 patch_extensions.py sources/read-aloud sources/twp

      - name: Vérifier la syntaxe du code modifié
        shell: bash
        run: |
          python3 -m py_compile patch_extensions.py tools/package_xpi.py
          node --check sources/read-aloud/js/popup.js
          node --check sources/twp/src/contentScript/pageTranslator.js
          node --check sources/twp/src/background/background.js

      - name: Numéroter cette version expérimentale
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          build = int(os.environ["RUN_NUMBER"])
          assert 1 <= build <= 65535, "Numéro de build trop grand"
          for path in (Path("sources/read-aloud/manifest.json"),
                       Path("sources/twp/src/manifest.json")):
              manifest = json.loads(path.read_text(encoding="utf-8"))
              parts = manifest["version"].split(".")
              parts = (parts + ["0", "0"])[:3]
              assert all(part.isdigit() for part in parts)
              manifest["version"] = ".".join([*parts, str(build)])
              path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"{path}: version {manifest['version']}")
          PY

      - name: Construire deux fichiers XPI non signés
        shell: bash
        run: |
          python3 tools/package_xpi.py sources/read-aloud dist/read-aloud-traduire-ecouter.xpi
          python3 tools/package_xpi.py sources/twp/src dist/twp-traduire-ecouter.xpi

      - name: Mettre les archives à disposition
        uses: actions/upload-artifact@v4
        with:
          name: extensions-experimentales-non-signees
          path: dist/*.xpi
          retention-days: 14
          if-no-files-found: error

      - name: Préparer la signature Mozilla
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer web-ext de Mozilla
        run: npm install --global web-ext@10

      - name: Signer Read Aloud expérimental via Mozilla (distribution privée)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEB_EXT_NO_INPUT: 'true'
        run: |
          WEB_EXT_API_KEY="$(printf '%s' "$WEB_EXT_API_KEY" | tr -d '[:space:]')"
          WEB_EXT_API_SECRET="$(printf '%s' "$WEB_EXT_API_SECRET" | tr -d '[:space:]')"
          export WEB_EXT_API_KEY WEB_EXT_API_SECRET
          test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET" || { echo "::error::Secrets Mozilla manquants"; exit 1; }
          mkdir -p dist/signed
          web-ext sign --source-dir sources/read-aloud --artifacts-dir dist/signed --channel unlisted

      - name: Signer TWP expérimental via Mozilla (distribution privée)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEB_EXT_NO_INPUT: 'true'
        run: |
          WEB_EXT_API_KEY="$(printf '%s' "$WEB_EXT_API_KEY" | tr -d '[:space:]')"
          WEB_EXT_API_SECRET="$(printf '%s' "$WEB_EXT_API_SECRET" | tr -d '[:space:]')"
          export WEB_EXT_API_KEY WEB_EXT_API_SECRET
          test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET" || { echo "::error::Secrets Mozilla manquants"; exit 1; }
          web-ext sign --source-dir sources/twp/src --artifacts-dir dist/signed --channel unlisted

      - name: Vérifier que Mozilla a produit deux fichiers signés
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          files = sorted(Path('dist/signed').glob('*.xpi'))
          assert len(files) == 2, f'Attendu 2 XPI signés, obtenu {len(files)}'
          for xpi in files:
              with ZipFile(xpi) as archive:
                  assert "manifest.json" in archive.namelist(), xpi
                  signed = [p for p in archive.namelist() if p.startswith("META-INF/")]
                  assert signed, f"Signature manquante dans {xpi}"
              print(f"Fichier signé reçu : {xpi.name} ({xpi.stat().st_size} octets)")
          PY

      - name: Télécharger les extensions signées depuis GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: extensions-experimentales-signees-mozilla
          path: dist/signed/*.xpi
          retention-days: 14
          if-no-files-found: error
